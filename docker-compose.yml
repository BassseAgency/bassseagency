# Postgres local para desarrollo y tests de integración.
# Uso: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: bassseagency
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bassseagency"]
      interval: 2s
      timeout: 3s
      retries: 20
